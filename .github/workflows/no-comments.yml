name: No comments gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  no-comments:
    name: no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:no-comments -- --base "${{ github.event.pull_request.base.sha }}"
